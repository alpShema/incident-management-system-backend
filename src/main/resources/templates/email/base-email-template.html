<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="x-apple-disable-message-reformatting">
  <meta name="format-detection" content="telephone=no,date=no,address=no,email=no">
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <title>{{subject}}</title>
  <!--[if mso]>
  <style type="text/css">
    * { font-family: Arial, sans-serif !important; }
    table { border-collapse: collapse; }
  </style>
  <![endif]-->
  <style type="text/css">
    body {
      margin: 0 !important;
      padding: 0 !important;
      -webkit-text-size-adjust: 100% !important;
      -ms-text-size-adjust: 100% !important;
      width: 100% !important;
      height: 100% !important;
    }
    table {
      border-collapse: collapse !important;
      mso-table-lspace: 0pt !important;
      mso-table-rspace: 0pt !important;
    }
    img {
      border: 0 !important;
      height: auto !important;
      line-height: 100% !important;
      outline: none !important;
      text-decoration: none !important;
      -ms-interpolation-mode: bicubic !important;
    }
    a { text-decoration: none !important; }

    .preheader {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      color: transparent !important;
      height: 0 !important;
      width: 0 !important;
      line-height: 0 !important;
      max-height: 0 !important;
      max-width: 0 !important;
      overflow: hidden !important;
      mso-hide: all !important;
      font-size: 1px !important;
    }

    img {
      max-width: 100% !important;
      height: auto !important;
      display: block;
    }

    .logo-xs { display: none; }
    .logo-md { display: inline-block; }

    /* AMALITECH footer logo is a static raster image with its color baked in (no CSS-controlled
       fill like the old inline SVG), so dark mode needs an actual alternate white-text asset
       rather than a recolor. Toggled ONLY via data-ogsc/data-ogsb (below) — deliberately NOT via
       @media (prefers-color-scheme: dark): that media query reflects the OS-level preference,
       not whether this card's background actually ends up dark. Clients that honor our
       color-scheme:light meta tag keep the background genuinely white while still matching a
       dark OS preference, which would make a media-query-toggled white logo invisible. data-ogsc
       is Outlook's own marker for "I recolored this dark," so it tracks reality instead. */
    .footer-logo-light { display: block; }
    .footer-logo-dark { display: none; }

    /* Header HILFE logo and icon collage are the same kind of color-baked raster as the
       AMALITECH footer logo above — same light/dark pair, same data-ogsc/data-ogsb toggle. */
    .header-logo-light,
    .header-icon-light { display: block; }
    .header-logo-dark,
    .header-icon-dark { display: none; }

    .email-cta-link {
      color: #08283B;
      text-decoration: underline;
    }

    .email-cta-link:hover {
      color: #072436;
    }

    #outlook a { padding: 0; }

    u + .body .email-wrapper { min-width: 100vw; }

    @media only screen and (max-width: 320px) {
      .email-container { width: 100% !important; max-width: 320px !important; }
      .logo-xs { display: inline-block !important; }
      .logo-md { display: none !important; }
    }

    @media only screen and (min-width: 321px) and (max-width: 510px) {
      .email-container { width: 100% !important; max-width: 510px !important; }
      .logo-xs { display: inline-block !important; }
      .logo-md { display: none !important; }
    }

    @media only screen and (min-width: 511px) {
      .email-container { width: 100% !important; max-width: 672px !important; }
    }

    /* Outlook.com / new Outlook / mobile Outlook apply their own auto-dark-mode
       conversion independently of the color-scheme meta tags above, tagging the
       elements they recolor with data-ogsc/data-ogsb. These rules force our
       light-only palette back on top of that auto-injected styling. */
    [data-ogsc] .email-container,
    [data-ogsb] .email-container {
      border-color: #E6EAEB !important;
    }

    [data-ogsc] .email-wrapper,
    [data-ogsb] .email-wrapper {
      background-color: #FDFDFD !important;
      color: #08283B !important;
    }

    [data-ogsc] .email-header td,
    [data-ogsb] .email-header td {
      background-color: #ECECEB !important;
    }

    [data-ogsc] .email-content,
    [data-ogsb] .email-content {
      color: #08283B !important;
    }

    [data-ogsc] .email-cta,
    [data-ogsb] .email-cta {
      background-color: #08283B !important;
      color: #FDFDFD !important;
    }

    [data-ogsc] .email-cta-link,
    [data-ogsb] .email-cta-link {
      color: #08283B !important;
    }

    [data-ogsc] .email-footer,
    [data-ogsb] .email-footer,
    [data-ogsc] .email-footer p,
    [data-ogsb] .email-footer p {
      color: #395362 !important;
    }

    [data-ogsc] img,
    [data-ogsb] img {
      filter: none !important;
      opacity: 1 !important;
    }

    [data-ogsc] .footer-logo-light,
    [data-ogsb] .footer-logo-light {
      display: none !important;
    }

    [data-ogsc] .footer-logo-dark,
    [data-ogsb] .footer-logo-dark {
      display: block !important;
    }

    [data-ogsc] .header-logo-light,
    [data-ogsb] .header-logo-light,
    [data-ogsc] .header-icon-light,
    [data-ogsb] .header-icon-light {
      display: none !important;
    }

    [data-ogsc] .header-logo-dark,
    [data-ogsb] .header-logo-dark,
    [data-ogsc] .header-icon-dark,
    [data-ogsb] .header-icon-dark {
      display: block !important;
    }

  </style>
</head>
<body bgcolor="#f5f5f5" style="margin:0;padding:0;background-color:#f5f5f5;width:100%;">
  
    <div class="preheader" style="display:none;visibility:hidden;opacity:0;color:transparent;height:0;width:0;line-height:0;max-height:0;max-width:0;overflow:hidden;mso-hide:all;font-size:1px;" aria-hidden="true">
        {{preheader}}&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
       </div>
    <div class="email-container" style="width:100%;max-width:672px;margin:0 auto;border-radius:8px;border:1px solid #E6EAEB;overflow:hidden;box-sizing:border-box;">
      <table role="presentation" lang="en" class="email-wrapper" cellpadding="0" cellspacing="0" bgcolor="#FDFDFD"
             style="width:100%;background-color:#FDFDFD;font-family:Arial, Helvetica, sans-serif;color:#08283B;table-layout:fixed;word-wrap:break-word;">

        <!-- Header -->
        <tr class="email-header">
          <td bgcolor="#ECECEB" style="padding:0 0 0 24px;text-align:left;vertical-align:middle;width:auto;background-color:#ECECEB;">
            <img class="header-logo-light" src="{{app_base_url}}/images/email/hilfe-logo-email.png" width="120" height="63" alt="HILFE" style="width:120px;height:63px;">
            <img class="header-logo-dark" src="{{app_base_url}}/images/email/hilfe-logo-email-dark.png" width="120" height="63" alt="HILFE" style="width:120px;height:63px;">
          </td>
          <td bgcolor="#ECECEB" style="text-align:right;padding:0;line-height:0;vertical-align:middle;background-color:#ECECEB;white-space:nowrap;">
            <img class="header-icon-light" src="{{app_base_url}}/images/email/hilfe-icon-collage-email.png" width="330" height="193" alt="" style="width:330px;height:193px;">
            <img class="header-icon-dark" src="{{app_base_url}}/images/email/hilfe-icon-collage-email-dark.png" width="330" height="193" alt="" style="width:330px;height:193px;">
          </td>
        </tr>

        <!-- Content -->
        <tr>
          <td class="email-content" colspan="2" bgcolor="#FDFDFD"
              style="padding:48px 24px 16px 24px;font-size:16px;line-height:1.5;color:#08283B;font-weight:400;word-wrap:break-word;overflow-wrap:break-word;word-break:break-word;">
            {{content}}
          </td>
        </tr>

        <!-- CTA -->
        <tr>
        <td colspan="2" bgcolor="#FDFDFD" style="text-align:left;padding:0 24px 48px;word-wrap:break-word;overflow-wrap:break-word;">

    <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0;">
      <tr>
        <td bgcolor="#08283B" style="background-color:#08283B;border-radius:8px;text-align:left;">
          <a href="{{cta_href}}" class="email-cta" role="button" target="_blank" rel="noopener noreferrer"
             style="display:inline-block;padding:10px 20px;background-color:#08283B;color:#FDFDFD;text-decoration:none;font-weight:500;font-size:16px;line-height:1.2;border:none;border-radius:8px;">
            {{cta_text}}
          </a>
        </td>
      </tr>
    </table>
        </td>
       </tr>

        <!-- Footer -->
        <tr>
          <td class="email-footer" colspan="2" bgcolor="#FDFDFD"
              style="padding:0 24px 48px;font-size:12px;line-height:1.5;color:#395362;text-align:left;word-wrap:break-word;overflow-wrap:break-word;">
            <img class="footer-logo-light" src="{{app_base_url}}/images/email/amalitech-logo-email.png" width="200" height="18" alt="AMALITECH" style="width:200px;height:18px;">
            <img class="footer-logo-dark" src="{{app_base_url}}/images/email/amalitech-logo-email-dark.png" width="200" height="18" alt="AMALITECH" style="width:200px;height:18px;">
            <p style="margin:16px 0 8px 0;font-size:12px;color:#395362;font-weight:400;word-wrap:break-word;overflow-wrap:break-word;">{{footer_text}}</p>
          </td>
        </tr>

      </table>
    </div>
</body>
</html>
