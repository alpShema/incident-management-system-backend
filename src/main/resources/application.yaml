spring:
  application:
    name: hilfe

  # ──────────────────────────────────────────
  # Database
  # ──────────────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hilfe}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: HilfeHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ──────────────────────────────────────────
  # JPA / Hibernate
  # ──────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: com.amalitech.hilfe.config.PrismaPhysicalNamingStrategy
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  # ──────────────────────────────────────────
  # Flyway (Database Migration)
  # ──────────────────────────────────────────
  flyway:
    enabled: true
    baseline-on-migrate: true
    repair-on-migrate: true
    validate-on-migrate: false

  # ──────────────────────────────────────────
  # GraphQL
  # ──────────────────────────────────────────
  graphql:
    graphiql:
      enabled: true
    path: /graphql

# ──────────────────────────────────────────
# Server
# ──────────────────────────────────────────
server:
  port: ${SERVER_PORT:8080}
  server-header: ''
  error:
    include-message: always
    include-binding-errors: always

# ──────────────────────────────────────────
# Springdoc / Swagger UI
# ──────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  show-actuator: false

# ──────────────────────────────────────────
# Actuator
# ──────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

# ──────────────────────────────────────────
# Application Info (shown in Actuator /info)
# ──────────────────────────────────────────
info:
  app:
    name: ${spring.application.name}
    version: "@project.version@"
    description: "Hilfe API - Amalitech"

# ──────────────────────────────────────────
# Auth / JWT
# ──────────────────────────────────────────
app:
  jwt:
    issuer: ${JWT_ISSUER:hilfe}
    audience: ${JWT_AUDIENCE:hilfe-web}
    secret: ${JWT_SECRET:change-me}
    access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:3600}
    refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:86400}

# ──────────────────────────────────────────
# Logging
# ──────────────────────────────────────────
logging:
  level:
    root: INFO
    com.amalitech.hilfe: DEBUG
    org.hibernate.SQL: DEBUG
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: dev
logging:
  level:
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG

# ──────────────────────────────────────────
# ARMS SSO Integration
# ──────────────────────────────────────────
arms:
  sso-url: ${ARMS_SSO_URL:http://localhost}

# ──────────────────────────────────────────
# Cookie
# ──────────────────────────────────────────
cookie:
  secure: ${COOKIE_SECURE:false}
  same-site: ${COOKIE_SAME_SITE:None}

# ──────────────────────────────────────────
# CORS
# ──────────────────────────────────────────
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  # Extra origins always added on top of allowed-origins (e.g. local dev ports).
  # Override via CORS_EXTRA_ALLOWED_ORIGINS if needed; set to empty string to disable.
  extra-allowed-origins: ${CORS_EXTRA_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000}

# ──────────────────────────────────────────
# AWS S3
# ──────────────────────────────────────────
s3:
  bucket-name: ${S3_BUCKET_NAME}
  region: ${S3_REGION:eu-west-1}
  access-key-id: ${S3_ACCESS_KEY_ID:}
  secret-access-key: ${S3_SECRET_ACCESS_KEY:}
  presign-expiry: ${S3_PRESIGN_EXPIRY:PT15M}

# ──────────────────────────────────────────
# Auto-Close Scheduler
# ──────────────────────────────────────────
auto-close:
  cron: "0 * * * * *"   # every minute — change to adjust polling frequency

# ──────────────────────────────────────────
# Media / Attachments
# ──────────────────────────────────────────
media:
  max-file-size: ${MEDIA_MAX_FILE_SIZE:10485760}
  max-attachments: ${MEDIA_MAX_ATTACHMENTS:5}
  allowed-content-types: image/jpeg,image/png,image/gif,image/webp,application/pdf,image/svg+xml,text/plain

# ──────────────────────────────────────────
# Slack Bot Integration
# ──────────────────────────────────────────
slack:
  enabled: ${SLACK_ENABLED:false}
  signing-secret: ${SLACK_SIGNING_SECRET:}
  bot-token: ${SLACK_BOT_TOKEN:}
  client-id: ${SLACK_CLIENT_ID:}
  client-secret: ${SLACK_CLIENT_SECRET:}
  redirect-uri: ${SLACK_REDIRECT_URI:}
  frontend-connect-url: ${SLACK_FRONTEND_CONNECT_URL:}
  frontend-success-url: ${SLACK_FRONTEND_SUCCESS_URL:}
  app-id: ${SLACK_APP_ID:}
  notifications-enabled: ${SLACK_NOTIFICATIONS_ENABLED:false}
  agent-features-enabled: ${SLACK_AGENT_FEATURES_ENABLED:false}
  rate-limit:
    requests-per-minute: ${SLACK_RATE_LIMIT_RPM:60}
    burst-size: ${SLACK_RATE_LIMIT_BURST:10}

# ──────────────────────────────────────────
# Encryption (for Slack tokens at rest)
# ──────────────────────────────────────────
encryption:
  key: ${ENCRYPTION_KEY:}

# ──────────────────────────────────────────
# FAQ Chatbot
# ──────────────────────────────────────────
chatbot:
  confidence-threshold: ${CHATBOT_CONFIDENCE_THRESHOLD:0.25}
  rate-limit: ${CHATBOT_RATE_LIMIT:30}
  conversation-window-size: ${CHATBOT_CONVERSATION_WINDOW_SIZE:10}
  summary-trigger-interval: ${CHATBOT_SUMMARY_TRIGGER_INTERVAL:5}

# ──────────────────────────────────────────
# AmaliAI Proxy (shared key for both LLM and embeddings)
# ──────────────────────────────────────────
amali-ai:
  api-key: ${AMALI_AI_API_KEY:}
  base-url: ${AMALI_AI_BASE_URL:}
  provider: openai

# ──────────────────────────────────────────
# AI Embedding
# ──────────────────────────────────────────
embedding:
  model: ${EMBEDDING_MODEL:text-embedding-3-small}

# ──────────────────────────────────────────
# AI LLM
# ──────────────────────────────────────────
llm:
  model: ${LLM_MODEL:gpt-4o-mini}
