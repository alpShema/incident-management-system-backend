spring:
  application:
    name: hilfe

  # Fallback profile when nothing else (env var, command-line arg) specifies one.
  # SPRING_PROFILES_ACTIVE still overrides this if/when it's set on a deployed host.
  profiles:
    default: dev

  # ──────────────────────────────────────────
  # Database
  # ──────────────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hilfe}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: HilfeHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ──────────────────────────────────────────
  # JPA / Hibernate
  # ──────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: com.amalitech.hilfe.config.PrismaPhysicalNamingStrategy
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  # ──────────────────────────────────────────
  # Flyway (Database Migration)
  # ──────────────────────────────────────────
  flyway:
    enabled: true
    baseline-on-migrate: true
    repair-on-migrate: true
    validate-on-migrate: false
    placeholders:
      # Gates the placeholder Department/Category/Topic taxonomy seeded by
      # V21 (see V68) — true everywhere except staging/production, so the
      # local/dev/testing seed workflow is unaffected. Override to "false"
      # in a profile's YAML (see application-staging.yaml) to keep that
      # environment's taxonomy empty for admin-driven configuration.
      # Frozen as-is (used only by the already-applied V68) — new seed
      # exclusions should gate on seedDemoData instead, not repurpose this one.
      seedDemoTaxonomy: "true"
      # Gates the seeded "System" user (V21) and "Super Admin" role catalog
      # entry (V35) — see V69. Same true-everywhere-except-staging/production
      # shape as seedDemoTaxonomy; kept as a separate flag so V68 (already
      # applied on every environment) never needs to change.
      seedDemoData: "true"

  # ──────────────────────────────────────────
  # GraphQL
  # ──────────────────────────────────────────
  graphql:
    graphiql:
      enabled: true
    path: /graphql
    # WebSocket subscriptions are wired manually in GraphQlWebSocketConfig instead of via
    # spring.graphql.websocket.path, so a HandshakeInterceptor can be attached for cookie-based
    # auth (see GraphQlWebSocketHandshakeInterceptor for why).

# ──────────────────────────────────────────
# Server
# ──────────────────────────────────────────
server:
  port: ${SERVER_PORT:8080}
  server-header: ''
  error:
    include-message: always
    include-binding-errors: always

# ──────────────────────────────────────────
# Springdoc / Swagger UI
# ──────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  show-actuator: false

# ──────────────────────────────────────────
# Actuator
# ──────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
  info:
    env:
      enabled: true

# ──────────────────────────────────────────
# Application Info (shown in Actuator /info)
# ──────────────────────────────────────────
info:
  app:
    name: ${spring.application.name}
    version: "@project.version@"
    description: "Hilfe API - Amalitech"

# ──────────────────────────────────────────
# Auth / JWT
# ──────────────────────────────────────────
app:
  base-url: ${APP_BASE_URL}
  frontend-url: ${APP_FRONTEND_URL}
  slack-image-report-url: ${SLACK_IMAGE_REPORT_URL:${app.base-url}/images/slack-report.jpg}
  slack-image-updates-url: ${SLACK_IMAGE_UPDATES_URL:${app.base-url}/images/slack-updates.jpg}
  jwt:
    issuer: ${JWT_ISSUER:hilfe}
    audience: ${JWT_AUDIENCE:hilfe-web}
    secret: ${JWT_SECRET:change-me}
    access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:3600}
    refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:86400}

# ──────────────────────────────────────────
# Logging
# ──────────────────────────────────────────
# Log levels and output format are configured in logback-spring.xml.

# ──────────────────────────────────────────
# AI Embedding
# ──────────────────────────────────────────
embedding:
  model: ${EMBEDDING_MODEL:text-embedding-3-small}

# ──────────────────────────────────────────
# AWS S3
# ──────────────────────────────────────────
s3:
  bucket-name: ${S3_BUCKET_NAME}
  region: ${S3_REGION:eu-west-1}
  access-key-id: ${S3_ACCESS_KEY_ID:}
  secret-access-key: ${S3_SECRET_ACCESS_KEY:}
  presign-expiry: ${S3_PRESIGN_EXPIRY:PT15M}

# ──────────────────────────────────────────
# Auto-Close Scheduler
# ──────────────────────────────────────────
auto-close:
  cron: "0 * * * * *"   # every minute — change to adjust polling frequency

# ──────────────────────────────────────────
# Media / Attachments
# ──────────────────────────────────────────
media:
  max-file-size: ${MEDIA_MAX_FILE_SIZE:10485760}
  max-attachments: ${MEDIA_MAX_ATTACHMENTS:5}
  allowed-content-types: image/jpeg,image/png,image/gif,image/webp,application/pdf,image/svg+xml,text/plain

# ──────────────────────────────────────────
# Encryption (for Slack tokens at rest)
# ──────────────────────────────────────────
encryption:
  key: ${ENCRYPTION_KEY:}

# ──────────────────────────────────────────
# FAQ Chatbot
# ──────────────────────────────────────────
chatbot:
  confidence-threshold: ${CHATBOT_CONFIDENCE_THRESHOLD:0.25}
  rate-limit: ${CHATBOT_RATE_LIMIT:30}
  conversation-window-size: ${CHATBOT_CONVERSATION_WINDOW_SIZE:10}
  summary-trigger-interval: ${CHATBOT_SUMMARY_TRIGGER_INTERVAL:5}

# ──────────────────────────────────────────
# AmaliAI Proxy (shared key for both LLM and embeddings)
# ──────────────────────────────────────────
amali-ai:
  api-key: ${AMALI_AI_API_KEY:}
  base-url: ${AMALI_AI_BASE_URL:}
  provider: openai

# ──────────────────────────────────────────
# AI LLM
# ──────────────────────────────────────────
llm:
  model: ${LLM_MODEL:gpt-4o-mini}
  temperature: ${LLM_TEMPERATURE:0.2}
  max-tokens: ${LLM_MAX_TOKENS:512}
