spring:
  application:
    name: hilfe

  # ──────────────────────────────────────────
  # Database
  # ──────────────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hilfe}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: HilfeHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ──────────────────────────────────────────
  # JPA / Hibernate
  # ──────────────────────────────────────────

    jpa:
      hibernate:
        # Validate entities match the existing Prisma-managed database
        ddl-auto: validate
        naming:
          # Preserve PascalCase table names from Prisma (User, AgentGroup, etc.)
          physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
      show-sql: false
      open-in-view: false
      properties:
        hibernate:
          format_sql: true
          dialect: org.hibernate.dialect.PostgreSQLDialect
          jdbc:
            time_zone: UTC

  # ──────────────────────────────────────────
  # Flyway (Database Migration)
  # ──────────────────────────────────────────
  flyway:
    # Disabled — connecting to existing Prisma-managed database
    enabled: false

# ──────────────────────────────────────────
# Server
# ──────────────────────────────────────────
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

# ──────────────────────────────────────────
# Springdoc / Swagger UI
# ──────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  show-actuator: false

# ──────────────────────────────────────────
# Actuator
# ──────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

# ──────────────────────────────────────────
# Application Info (shown in Actuator /info)
# ──────────────────────────────────────────
info:
  app:
    name: ${spring.application.name}
    version: "@project.version@"
    description: "Hilfe API - Amalitech"

# ──────────────────────────────────────────
# Logging
# ──────────────────────────────────────────
logging:
  level:
    root: INFO
    com.amalitech.hilfe: DEBUG
    org.hibernate.SQL: DEBUG
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
