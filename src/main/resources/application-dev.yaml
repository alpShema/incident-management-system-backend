# ──────────────────────────────────────────
# Dev profile overrides
# Loaded only when spring.profiles.active includes "dev". Local/dev-friendly
# defaults: verbose request logging, cookies usable over plain HTTP, and CORS
# opened up to local frontend dev servers.
# ──────────────────────────────────────────
logging:
  level:
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG

# ──────────────────────────────────────────
# ARMS SSO Integration
# ──────────────────────────────────────────
arms:
  sso-url: ${ARMS_SSO_URL:http://localhost}

# ──────────────────────────────────────────
# Cookie
# ──────────────────────────────────────────
cookie:
  secure: ${COOKIE_SECURE:false}
  same-site: ${COOKIE_SAME_SITE:None}

# ──────────────────────────────────────────
# CORS
# ──────────────────────────────────────────
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  # Extra origins always added on top of allowed-origins (e.g. local dev ports).
  # Override via CORS_EXTRA_ALLOWED_ORIGINS if needed; set to empty string to disable.
  extra-allowed-origins: ${CORS_EXTRA_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000}

# ──────────────────────────────────────────
# Slack Bot Integration
# ──────────────────────────────────────────
slack:
  enabled: ${SLACK_ENABLED:false}
  signing-secret: ${SLACK_SIGNING_SECRET:}
  bot-token: ${SLACK_BOT_TOKEN:}
  client-id: ${SLACK_CLIENT_ID:}
  client-secret: ${SLACK_CLIENT_SECRET:}
  redirect-uri: ${SLACK_REDIRECT_URI:}
  frontend-connect-url: ${SLACK_FRONTEND_CONNECT_URL:}
  frontend-success-url: ${SLACK_FRONTEND_SUCCESS_URL:http://hilfe-pro-frontend.amalitech-dev.net/slack/connect?success=true}
  frontend-error-url: ${SLACK_FRONTEND_ERROR_URL:http://hilfe-pro-frontend.amalitech-dev.net/slack/connect?success=false}
  app-id: ${SLACK_APP_ID:}
  notifications-enabled: ${SLACK_NOTIFICATIONS_ENABLED:false}
  agent-features-enabled: ${SLACK_AGENT_FEATURES_ENABLED:false}
  rate-limit:
    requests-per-minute: ${SLACK_RATE_LIMIT_RPM:60}
    burst-size: ${SLACK_RATE_LIMIT_BURST:10}

# ──────────────────────────────────────────
# Email (SMTP) — Mailtrap sandbox for dev/testing
# ──────────────────────────────────────────
spring:
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

mail:
  enabled: ${MAIL_ENABLED}
  from-address: ${MAIL_FROM_ADDRESS}
  from-name: ${MAIL_FROM_NAME}
  # Mailtrap's free Testing plan enforces a strict emails/second cap — keep this conservative.
  rate-limit:
    emails-per-second: ${MAIL_RATE_LIMIT_PER_SECOND:2}
