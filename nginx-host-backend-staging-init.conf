# nginx-host-backend-staging-init.conf
# Used on first deploy to staging backend before SSL certificates exist.
# Deploy to: /etc/nginx/sites-available/hilfe-backend

server {
    listen 80;
    listen [::]:80;
    server_name hilfe-pro-service-stage.amalitech-dev.net;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        proxy_hide_header Server;
    }

    location ~ /\. {
        deny all;
    }
}
