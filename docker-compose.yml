# docker-compose.yml
# Deployed to /home/ubuntu/app/ on the BACKEND EC2 (hilfe-pro-service.amalitech-dev.net).
# Runs the Spring Boot backend and PostgreSQL database.
#
# Required environment variables (set by Jenkins or in .env):
#   SPRING_PROFILES_ACTIVE — active Spring profile, e.g. dev or prod
#   BACKEND_IMAGE   — full ECR image URL for the backend
#   DB_NAME         — PostgreSQL database name
#   DB_USER         — PostgreSQL username
#   DB_PASSWORD     — PostgreSQL password (store in Jenkins credentials, never in plaintext)
#   APP_BASE_URL    — public backend base URL, e.g. https://hilfe-pro-service.amalitech-dev.net
#   APP_FRONTEND_URL — public frontend URL used in Slack/email links, e.g. https://hilfe-pro-frontend.amalitech-dev.net
#   MAIL_ENABLED, MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD,
#   MAIL_FROM_ADDRESS, MAIL_FROM_NAME — SMTP config, no defaults in yaml

services:

  # --------------------------------------------------------------------------
  # Database — PostgreSQL 16
  # Not exposed externally; only reachable by the backend over the internal
  # hilfe-net bridge network.
  # --------------------------------------------------------------------------
  db:
    image: pgvector/pgvector:pg16
    container_name: hilfe-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hilfe-net

  # --------------------------------------------------------------------------
  # Backend — Spring Boot (port 8080)
  # Pulled from ECR. Flyway runs automatically on startup to migrate the DB.
  # Waits for the db health check before starting.
  # --------------------------------------------------------------------------
  backend:
    image: ${BACKEND_IMAGE}
    container_name: hilfe-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      DB_URL:      jdbc:postgresql://db:5432/${DB_NAME}
      DB_USERNAME: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      ARMS_SSO_URL: ${ARMS_SSO_URL}  # ARMS SSO base URL, e.g. https://sso.amalitech-dev.net
      ARMS_SSO_PUBLIC_KEY: ${ARMS_SSO_PUBLIC_KEY}  # RSA public key ARMS signs SSO tokens with (RS256), PEM with newlines escaped as \n
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}  # Comma-separated list of allowed CORS origins, e.g. https://hilfe.amalitech-dev.net
      COOKIE_SECURE: ${COOKIE_SECURE}  # "true" or "false" to set the Secure flag on cookies
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE}  # "Strict", "Lax", or "None" for the SameSite attribute on cookies
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_REGION: ${S3_REGION}
      S3_PRESIGN_EXPIRY: ${S3_PRESIGN_EXPIRY}
      MEDIA_MAX_FILE_SIZE: ${MEDIA_MAX_FILE_SIZE:-10485760}  # Max file size in bytes for images/docs, e.g. 10485760 for 10 MB
      MEDIA_MAX_VIDEO_FILE_SIZE: ${MEDIA_MAX_VIDEO_FILE_SIZE:-104857600}  # Max file size in bytes for video attachments, e.g. 104857600 for 100 MB
      MEDIA_MAX_TOTAL_ATTACHMENT_SIZE: ${MEDIA_MAX_TOTAL_ATTACHMENT_SIZE:-314572800}  # Max combined size in bytes of all attachments on one incident/message, e.g. 314572800 for 300 MB
      MEDIA_MAX_ATTACHMENTS: ${MEDIA_MAX_ATTACHMENTS:-5}  # Max number of attachments per ticket, e.g. 5
      MEDIA_ALLOWED_CONTENT_TYPES: ${MEDIA_ALLOWED_CONTENT_TYPES:-image/jpeg,image/png,image/gif,image/webp,application/pdf,image/svg+xml,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain,video/mp4,video/quicktime,video/webm}
      SLACK_ENABLED: ${SLACK_ENABLED}
      SLACK_NOTIFICATIONS_ENABLED: ${SLACK_NOTIFICATIONS_ENABLED}
      SLACK_AGENT_FEATURES_ENABLED: ${SLACK_AGENT_FEATURES_ENABLED}
      SLACK_APP_ID: ${SLACK_APP_ID}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}
      SLACK_REDIRECT_URI: ${SLACK_REDIRECT_URI}
      SLACK_FRONTEND_CONNECT_URL: ${SLACK_FRONTEND_CONNECT_URL}
      SLACK_FRONTEND_SUCCESS_URL: ${SLACK_FRONTEND_SUCCESS_URL:-http://hilfe-pro-frontend.amalitech-dev.net/slack/connect?success=true}
      SLACK_FRONTEND_ERROR_URL: ${SLACK_FRONTEND_ERROR_URL:-http://hilfe-pro-frontend.amalitech-dev.net/slack/connect?success=false}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      AMALI_AI_API_KEY: ${AMALI_AI_API_KEY}
      AMALI_AI_BASE_URL: ${AMALI_AI_BASE_URL}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-512}
      APP_BASE_URL: ${APP_BASE_URL}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL}
      MAIL_ENABLED: ${MAIL_ENABLED}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hilfe-net

networks:
  hilfe-net:
    driver: bridge

volumes:
  db_data: