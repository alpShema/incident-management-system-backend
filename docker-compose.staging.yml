# docker-compose.staging.yml
# Deployed to /home/ubuntu/app/ on the BACKEND EC2 in the staging environment.
# Unlike docker-compose.yml there is no local db container — the backend
# connects to AWS RDS PostgreSQL via DB_HOST.
#
# Required in /home/ubuntu/app/.env (written by bootstrap-staging.sh):
#   SPRING_PROFILES_ACTIVE — staging
#   BACKEND_IMAGE   — ECR image URL (updated by Jenkins on each deploy)
#   DB_HOST         — RDS endpoint
#   DB_PORT         — 5432
#   DB_NAME         — hilfe
#   DB_USER         — RDS username
#   DB_PASSWORD     — RDS password
#   ARMS_SSO_URL    — SSO validation endpoint
#   ARMS_SSO_PUBLIC_KEY — RSA public key ARMS signs SSO tokens with (RS256), PEM format
#                          with newlines escaped as \n
#   APP_BASE_URL    — public backend base URL, e.g. https://hilfe-staging-service.amalitech-dev.net
#   APP_FRONTEND_URL — public frontend URL used in Slack/email links, e.g. https://hilfe-staging-frontend.amalitech-dev.net
#   CORS_ALLOWED_ORIGINS — comma-separated allowed frontend origins
#   COOKIE_SECURE   — true
#   S3_BUCKET_NAME  — hilfe-v2-media-staging
#   S3_REGION       — eu-west-1
#   MAIL_ENABLED, MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD,
#   MAIL_FROM_ADDRESS, MAIL_FROM_NAME — SMTP config, no defaults in yaml
#   LOKI_PUSH_URL   — Loki push endpoint on the observability instance,
#                     e.g. http://<observability-instance-ip>:3100/loki/api/v1/push

services:

  backend:
    image: ${BACKEND_IMAGE}
    container_name: hilfe-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      DB_URL:      jdbc:postgresql://${DB_HOST}:${DB_PORT:-5432}/${DB_NAME}
      DB_USERNAME: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      ARMS_SSO_URL:                ${ARMS_SSO_URL}
      ARMS_SSO_PUBLIC_KEY:         ${ARMS_SSO_PUBLIC_KEY}
      CORS_ALLOWED_ORIGINS:        ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      COOKIE_SECURE:               ${COOKIE_SECURE}
      COOKIE_SAME_SITE:            ${COOKIE_SAME_SITE:-Lax}
      S3_BUCKET_NAME:              ${S3_BUCKET_NAME}
      S3_REGION:                   ${S3_REGION:-eu-west-1}
      S3_ACCESS_KEY_ID:            ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY:        ${S3_SECRET_ACCESS_KEY:-}
      S3_PRESIGN_EXPIRY:           ${S3_PRESIGN_EXPIRY:-3600}
      MEDIA_MAX_FILE_SIZE:         ${MEDIA_MAX_FILE_SIZE:-10485760}
      MEDIA_MAX_VIDEO_FILE_SIZE:   ${MEDIA_MAX_VIDEO_FILE_SIZE:-104857600}
      MEDIA_MAX_TOTAL_ATTACHMENT_SIZE: ${MEDIA_MAX_TOTAL_ATTACHMENT_SIZE:-314572800}
      MEDIA_MAX_ATTACHMENTS:       ${MEDIA_MAX_ATTACHMENTS:-5}
      MEDIA_ALLOWED_CONTENT_TYPES: ${MEDIA_ALLOWED_CONTENT_TYPES:-image/jpeg,image/png,image/gif,image/webp,application/pdf,image/svg+xml,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain,video/mp4,video/quicktime,video/webm}
      SLACK_ENABLED: ${SLACK_ENABLED}
      SLACK_NOTIFICATIONS_ENABLED: ${SLACK_NOTIFICATIONS_ENABLED}
      SLACK_AGENT_FEATURES_ENABLED: ${SLACK_AGENT_FEATURES_ENABLED}
      SLACK_APP_ID: ${SLACK_APP_ID}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}
      SLACK_REDIRECT_URI: ${SLACK_REDIRECT_URI}
      SLACK_FRONTEND_CONNECT_URL: ${SLACK_FRONTEND_CONNECT_URL}
      SLACK_FRONTEND_SUCCESS_URL: ${SLACK_FRONTEND_SUCCESS_URL:-http://hilfe-pro-frontend.amalitech-dev.net/slack/connect?success=true}
      SLACK_FRONTEND_ERROR_URL: ${SLACK_FRONTEND_ERROR_URL:-http://hilfe-pro-frontend.amalitech-dev.net/slack/connect?success=false}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      AMALI_AI_API_KEY: ${AMALI_AI_API_KEY}
      AMALI_AI_BASE_URL: ${AMALI_AI_BASE_URL}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-512}
      APP_BASE_URL: ${APP_BASE_URL}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL}
      MAIL_ENABLED: ${MAIL_ENABLED}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - hilfe-net

  # --------------------------------------------------------------------------
  # node_exporter — host-level metrics (CPU, memory, disk, network) for the
  # observability instance's Prometheus to scrape. Port 9100 must be reachable
  # from the observability instance's security group.
  # --------------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:latest
    container_name: hilfe-node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    networks:
      - hilfe-net

  # --------------------------------------------------------------------------
  # Alloy — tails the backend container's logs and ships them to the central
  # Loki instance on the observability host. LOKI_PUSH_URL points at
  # http://<observability-instance-ip>:3100/loki/api/v1/push.
  # --------------------------------------------------------------------------
  alloy:
    image: grafana/alloy:latest
    container_name: hilfe-alloy
    restart: unless-stopped
    environment:
      LOKI_PUSH_URL: ${LOKI_PUSH_URL}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./alloy-config.river:/etc/alloy/config.river:ro
    command: run /etc/alloy/config.river
    networks:
      - hilfe-net

networks:
  hilfe-net:
    driver: bridge
