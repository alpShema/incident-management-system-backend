# nginx-host-backend.conf
# Deploy to: /etc/nginx/sites-available/hilfe-backend
# Then enable: sudo ln -s /etc/nginx/sites-available/hilfe-backend /etc/nginx/sites-enabled/
#
# Prerequisites on the Ubuntu server:
#   sudo apt install -y nginx certbot python3-certbot-nginx
#   sudo certbot --nginx -d hilfe-pro-service.amalitech-dev.net
#
# Certbot will auto-populate the ssl_certificate paths below.
# After obtaining the cert, replace YOUR_DOMAIN with your actual domain.

##############################################################################
# HTTP — redirect all traffic to HTTPS
##############################################################################
server {
    listen 80;
    listen [::]:80;
    server_name hilfe-pro-service.amalitech-dev.net;

    # Certbot ACME challenge (used when renewing certificates)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP requests → HTTPS (301 permanent)
    location / {
        return 301 https://$host$request_uri;
    }
}

##############################################################################
# HTTPS — SSL termination + reverse proxy to the Spring Boot container
##############################################################################
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hilfe-pro-service.amalitech-dev.net;

    # --- SSL certificates (populated by Certbot) ---
    ssl_certificate     /etc/letsencrypt/live/hilfe-pro-service.amalitech-dev.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hilfe-pro-service.amalitech-dev.net/privkey.pem;

    # --- Modern SSL hardening ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS — tells browsers to always use HTTPS for this domain (1 year)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- Additional security headers ---
    # X-Frame-Options is intentionally omitted here — Spring Security sets it to DENY on every
    # response, which is the correct and stricter value for an API server. Adding SAMEORIGIN
    # at the nginx layer would produce duplicate, contradictory headers.
    add_header X-Content-Type-Options    "nosniff"              always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection          "1; mode=block"        always;

    # --- Proxy to the Spring Boot app running in Docker on port 8080 ---
    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Pass real client info to the container
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Block access to hidden files (e.g. .env, .git)
    location ~ /\. {
        deny all;
    }
}
