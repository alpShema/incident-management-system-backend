# nginx-host-backend-staging.conf
# Deployed to the STAGING backend EC2 once SSL certificates exist.
# Deploy to: /etc/nginx/sites-available/hilfe-backend

# Only upgrade the connection when the client actually asks to (real WebSocket
# handshake); SockJS's HTTP fallback transports (xhr_streaming, polling, etc.)
# have no Upgrade header and must be proxied as plain HTTP.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name hilfe-pro-service-stage.amalitech-dev.net;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hilfe-pro-service-stage.amalitech-dev.net;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/hilfe-pro-service-stage.amalitech-dev.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hilfe-pro-service-stage.amalitech-dev.net/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # X-Frame-Options is intentionally omitted here — Spring Security sets it to DENY on every
    # response, which is the correct and stricter value for an API server. Adding SAMEORIGIN
    # at the nginx layer would produce duplicate, contradictory headers.
    add_header X-Content-Type-Options    "nosniff"              always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    # X-XSS-Protection is intentionally omitted here — Spring Security sets it to 0 on every
    # response, which is the correct modern value (the browser XSS auditor is deprecated).
    # Adding "1; mode=block" at the nginx layer would produce duplicate, contradictory headers.

    location /ws {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;
        proxy_buffering       off;
        proxy_hide_header Server;
    }

    location /graphql {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;
        proxy_buffering       off;
        proxy_hide_header Server;
    }

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        proxy_hide_header Server;
    }

    location ~ /\. {
        deny all;
    }
}
