# nginx-host-backend-staging.conf
# Deployed to the STAGING backend EC2.
# Deploy to: /etc/nginx/sites-available/hilfe-backend
# SSL is configured manually on the server — pipeline deploys HTTP only.

server {
    listen 80;
    listen [::]:80;
    server_name hilfe-staging-service.amalitech-dev.net;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    location ~ /\. {
        deny all;
    }
}
